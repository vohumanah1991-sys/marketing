<style>

</style></head><body>
<div class="app">
<header><div class="brand">وُهو <small id="who"></small></div>
<!-- «شروع از نو» در هر حالتی همین‌جاست، نه فقط در صفحه‌ی خطا: اجرای
     ذخیره‌شده بی‌سروصدا برمی‌گردد و بدون این، تنها راه پاک‌کردن دستی .vohu بود. -->
<div class="sm" style="display:flex;gap:10px;align-items:baseline">
<span id="stg"></span>
<button class="g hbtn" type="button" onclick="freshStart()">شروع از نو</button></div></header>
<main id="m"></main>
</div>

<script>
// ── دام خطا ──────────────────────────────────────────────
// روی تبلت کنسول باز نمی‌شود. پس هر خطا را روی خود صفحه نشان بده.
(function(){
  function show(kind, msg, extra){
    var d = document.getElementById('jserr');
    if (!d) { d = document.createElement('div'); d.id = 'jserr';
      d.style.cssText = 'position:fixed;inset-inline:0;bottom:0;background:#c5221f;color:#fff;'
        + 'padding:12px;font:13px system-ui;z-index:9999;max-height:45vh;overflow:auto;white-space:pre-wrap';
      document.body.appendChild(d); }
    d.textContent = '⚠ ' + kind + '\n' + msg + (extra ? '\n' + extra : '');
  }
  window.onerror = function(msg, src, line, col){
    show('خطای جاوااسکریپت', msg, (src||'').split('/').pop() + ':' + line + ':' + col);
    return false;
  };
  window.addEventListener('unhandledrejection', function(e){
    show('خطای رسیدگی‌نشده', (e.reason && e.reason.message) || String(e.reason));
  });

  // ضربان: به سرور بگو جاوااسکریپت اجرا شد. اگر در لاگ سرور
  // GET /api/version بعد از GET / نیامد، یعنی جاوااسکریپت اصلاً اجرا نشده.
  try {
    fetch('/api/version?from=page').then(function(r){ return r.json(); }).then(function(v){
      var el = document.getElementById('build');
      if (el) el.textContent = 'نسخه: ' + (v.build || '؟');
    }).catch(function(e){ show('fetch کار نمی‌کند', e.message,
      'یعنی مرورگر می‌تواند صفحه را بگیرد ولی درخواست پس‌زمینه نمی‌فرستد.'); });
  } catch (e) { show('fetch اصلاً وجود ندارد', e.message); }
})();
</script>
<script>
const $ = s => document.querySelector(s);
const M = $('#m');
let S = {}, url = '', busy = false;

// آخرین درخواستی که به /api/run رفت — برای «شروع از نو».
// url فقط بعد از یک جواب موفق پر می‌شود، پس اگر همان اولین درخواست خطا
// بدهد url خالی است و «شروع از نو» راهی برای ادامه ندارد. این همان چیزی
// را نگه می‌دارد که کاربر واقعاً فرستاده بود.
let lastRun = null;

const esc = s => String(s??'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const FA = {goal:'هدف',audience:'مخاطب',tension:'کشش',message:'پیام',
  reasonToBelieve:'دلیل باور',action:'اقدام',successSignal:'نشانه‌ی موفقیت'};
const PUR = {attention:'جلب توجه',case:'ساختن دلیل',objection:'برداشتن مانع',ask:'درخواست اقدام'};

let spinTimer = null;

/**
 * اسپینر با پیشرفت واقعی.
 * به‌جای حدس‌زدن اینکه کجای کاریم، هر دو ثانیه از سرور می‌پرسد.
 * اسم مدل هم از سرور می‌آید — در کد هیچ اسم مدلی نوشته نشده.
 */
/** مقدار یک ورودی؛ اگر عنصر نبود رشته‌ی خالی، نه انفجار. */
function val(id){ const e = $('#'+id); return e ? String(e.value||'').trim() : ''; }

function spin(t, live){
  clearInterval(spinTimer);
  const t0 = Date.now();
  M.innerHTML = `<div class="spin"><div><span class="d"></span><span class="d"></span><span class="d"></span></div>
    <div id="sp" style="margin-top:14px;font-size:14px">${esc(t)}</div>
    <div id="sl" class="sm" style="margin-top:8px;opacity:.65"></div>
    <div id="sbw" style="display:none;margin:10px auto 0;max-width:280px;height:6px;
         background:rgba(128,128,128,.25);border-radius:3px;overflow:hidden">
      <div id="sb" style="height:100%;width:0%;background:currentColor;opacity:.55;
           border-radius:3px;transition:width .4s"></div></div>
    <div id="sn" class="sm" style="margin-top:6px;opacity:.5"></div></div>`;

  let last = null, ticks = 0;

  spinTimer = setInterval(async () => {
    const el = $('#sl'); if(!el){ clearInterval(spinTimer); return; }
    const sec = Math.round((Date.now()-t0)/1000);
    el.textContent = sec + ' ثانیه';

    if (!live || !url) return;
    if (++ticks % 2) return;                 // هر ۲ ثانیه بپرس، نه هر ثانیه

    try{
      const p = await (await fetch('/api/run/progress?url=' + encodeURIComponent(url))).json();
      if (p.label) {
        $('#sp').textContent = p.label + '…';
        last = p;
      }
      // نوار پیشرفت فقط وقتی که سرور درصد واقعی داده — وگرنه پنهان می‌ماند.
      // درصد ساخته نمی‌شود؛ نبودش یعنی هنوز شمارشی در کار نیست.
      const wrap = $('#sbw'), bar = $('#sb');
      if (wrap && bar) {
        if (p.percent != null) { wrap.style.display = 'block'; bar.style.width = p.percent + '%'; }
        else wrap.style.display = 'none';
      }

      const bits = [];
      if (p.percent != null) bits.push(p.percent + '٪');
      if (p.itemsDone != null && p.itemsTotal)
        bits.push(p.itemsDone + ' از ' + p.itemsTotal);
      if (p.model)   bits.push(p.model);
      if (p.inputKB) bits.push(p.inputKB + 'KB ورودی');
      if (p.stages?.length) bits.push(p.stages.length + ' مرحله تمام');
      $('#sn').textContent = bits.join(' · ');

      // هشدار فقط وقتی معنی دارد: مرحله‌ای که خبری از خودش نمی‌دهد و طول کشیده.
      // اگر درصد واقعی داریم، طول‌کشیدن عیب نیست — خواندن اینستاگرام ذاتاً کند است.
      if (p.percent == null && p.elapsed != null && p.elapsed > 180)
        el.textContent = sec + ' ثانیه · این مرحله ' + p.elapsed + ' ثانیه است — ترمینال سرور را نگاه کن';
    }catch{}
  }, 1000);
}

async function api(path, body, method='POST', timeoutMs=300000){
  // درخواست دوم روی همان اجرا، فایل وضعیت را هم‌زمان بازنویسی می‌کند.
  // تا جواب اولی نیامده، کلیک بعدی نادیده گرفته می‌شود.
  if (busy) return;
  busy = true;
  if (path === '/api/run' && body) lastRun = body;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try{
    const r = await fetch(path, method==='GET'
      ? { signal: ctrl.signal }
      : { method, headers:{'content-type':'application/json'},
          body: JSON.stringify(body), signal: ctrl.signal });

    if (!r.ok && r.status >= 500) {
      let msg = `سرور خطا داد (${r.status})`, hint = null;
      try { const j = await r.json(); if (j.error) msg = j.error; hint = j.hint || null; } catch {}
      const err = new Error(msg); err.hint = hint; throw err;
    }
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    S = j; url = j.url || url; render();

  }catch(e){
    clearInterval(spinTimer);
    // سه حالت را از هم جدا کن — «خطا» تنها چیزی که کاربر باید ببیند نیست
    let title, hint;
    if (e.name === 'AbortError') {
      title = `بیش از ${Math.round(timeoutMs/1000)} ثانیه طول کشید و جوابی نیامد`;
      hint  = 'یعنی سرور جواب نداد. لاگ سرور را نگاه کن: tail -20 /root/repo/vohu.log';
    } else if (e instanceof TypeError) {
      title = 'اصلاً به سرور نرسید';
      hint  = 'سرور خوابیده یا شبکه قطع است. systemctl status vohu را چک کن.';
    } else {
      title = e.message;
      // اگر سرور گفته باشد چه کار باید کرد، همان را نشان بده —
      // «خطای خود برنامه» برای خالی‌بودن حساب یا شلوغی Anthropic غلط است.
      hint  = e.hint || 'این خطای خود برنامه است، نه شبکه.';
    }
    // ⚠ هر پیام خطایی که کاربر را متوقف می‌کند باید دست‌کم یک راه ادامه
    // داشته باشد. «برگرد» به همان بن‌بست برمی‌گردد و «بررسی اتصال» فقط
    // تشخیص است — «شروع از نو» تنها دکمه‌ای است که واقعاً جلو می‌برد.
    // پیام قفل سرویس/مدل هم از همین‌جا رد می‌شود، پس خودش دکمه را دارد:
    // آن پیام می‌گوید «یک اجرای تازه بساز» و این دکمه همان کار را می‌کند.
    M.innerHTML = `<div class="err">${esc(title)}</div>
      <p class="sm">${esc(hint)}</p>
      <button onclick="freshStart()">شروع از نو</button>
      <button class="g" onclick="checkConn()">بررسی اتصال</button>
      <button class="g" onclick="render()">برگرد</button>
      <div id="pg" class="sm" style="margin-top:12px"></div>`;
  }finally{ clearTimeout(timer); busy = false; }
}

/**
 * راه خروج از هر بن‌بست: اجرای تازه روی همان آدرس.
 *
 * اگر هنوز آدرسی نداریم، برگشتن به فرم اول همان «از نو» است.
 * وضعیت قبلی دور ریخته می‌شود (fresh)، چون خطایی که یک بار خورده‌ایم
 * در فایل وضعیت مانده و بدون این، هر بار همان بن‌بست تکرار می‌شود.
 */
function freshStart(){
  // منابعِ همین اجرا اولویت دارند: دکمه حالا در هدرِ *همه‌ی* صفحه‌هاست، پس
  // بیشتر وقت‌ها url پر است. فرستادن فقط url یعنی اینستاگرام و تلگرامی که
  // کاربر داده بود بی‌صدا از اجرای تازه می‌افتند.
  const src = (S.page && S.page.sources) || [];
  if (src.length) {
    const pick = k => { const x = src.find(s => s.kind === k); return x ? x.url : ''; };
    spin('از نو شروع می‌کنم…', true);
    api('/api/run', { fresh:true, site: pick('site'), instagram: pick('instagram'),
                      telegram: pick('telegram'), note: (S.note || '') });
    return;
  }
  // همان منابعی که کاربر داده بود، این بار با fresh — نه فقط url.
  // اگر اولین درخواست خطا داده باشد url هنوز خالی است (فقط بعد از جواب
  // موفق پر می‌شود) و بدون این، دکمه کاربر را به فرم خالی برمی‌گرداند:
  // او دوباره همان آدرس را می‌نویسد، دوباره بدون fresh فرستاده می‌شود و
  // دوباره همان خطا. دقیقاً همان حلقه‌ای که در لاگ دیده شد.
  if (!url && lastRun) {
    spin('از نو شروع می‌کنم…', true);
    api('/api/run', { ...lastRun, fresh:true });
    return;
  }
  if (!url) { S={}; render(); return; }
  spin('از نو شروع می‌کنم…', true);
  api('/api/run', { fresh:true, url });
}

/**
 * پیام خطای یک پنل — همیشه با دست‌کم یک راه ادامه.
 *
 * همان قاعده‌ی صفحه‌ی خطای اصلی، برای پنل‌های کوچک‌تر: پیامی که فقط
 * می‌گوید چه شد و کاری برای کردن نمی‌گذارد، کاربر را همان‌جا رها می‌کند.
 * فراخوانِ دکمه رشته‌ای ثابت در خود کد است، نه چیزی که از سرور آمده باشد.
 */
function errBox(msg, label, call){
  return `<div class="err">${esc(msg)}</div>
    <button style="margin-top:10px" onclick="${call}">${esc(label)}</button>`;
}

// بررسی اتصال — تا لازم نباشد کاربر با curl ور برود
async function checkConn(){
  const box = $('#pg') || M;
  box.innerHTML = '<p class="sm">در حال بررسی…</p>';
  try{
    const v = await (await fetch('/api/version')).json();
    const t = await (await fetch('/api/selftest')).json();
    const bad = (t.checks||[]).filter(c => c.ok === false);
    box.innerHTML = `<div class="card"><b>${esc(t['خلاصه']||'')}</b>
      <div class="sm">نسخه‌ی سرور: ${esc(v.build||'؟')} · مدل: ${esc(v.model||'؟')}</div>
      ${bad.map(b=>`<div class="sm">✗ ${esc(b.name)} — ${esc(b.detail||b.error||'')}</div>`).join('')}
      </div>`;
  }catch(e){
    box.innerHTML = `<div class="err">به سرور نرسیدم: ${esc(e.message)}</div>`;
  }
}

function render(){
  clearInterval(spinTimer);
  $('#who').textContent = url ? '· ' + url.replace(/^https?:\/\//,'') : '';
  $('#stg').textContent = S.stages ? S.stages.length + ' مرحله' : '';
  paint();
  // بعد از رسم، نه داخلش: هر صفحه M.innerHTML خودش را می‌نویسد و
  // نوار باید بالای همه‌شان بنشیند بدون اینکه در تک‌تکشان تکرار شود.
  restoredBar();
}

/** چه تاریخی — تقویم فارسی، و اگر مرورگر نداشت همان ISO. */
function dayFa(iso){
  const d = new Date(iso || '');
  if (isNaN(d)) return null;
  try { return d.toLocaleDateString('fa-IR'); } catch { return d.toISOString().slice(0,10); }
}
/** رقم فارسی — کنار تاریخِ تقویم فارسی، عدد لاتین وصله‌ی ناجور است. */
function faNum(n){ return String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

/** چقدر پیش — «۳ روز پیش» بیشتر از یک تاریخ به کاربر می‌گوید. */
function agoFa(iso){
  const d = new Date(iso || '');
  if (isNaN(d)) return null;
  const h = (Date.now() - d.getTime())/3600000;
  if (h < 0) return null;                       // ساعت سیستم عقب است — عدد نساز
  return h < 1 ? 'همین حالا'
       : (h < 48 ? faNum(Math.round(h))+' ساعت پیش' : faNum(Math.round(h/24))+' روز پیش');
}

/**
 * «این را همین حالا نساختم» — بالای هر نتیجه‌ای که از انبار درآمده.
 *
 * سه بار کاربر نتیجه‌ی چند روز پیش را نتیجه‌ی همین حالا گرفت. تاریخ و
 * سرویس/مدلِ سازنده از سرور می‌آید (مهر producedBy)، در کد چیزی حدس زده نمی‌شود.
 *
 * و اگر سرویس/مدل فعلی با سازنده فرق دارد، صریح گفته می‌شود: بی‌سروصدا
 * نشان‌دادن خروجی مدل قبلی زیر نام مدل فعلی، همان گمراهی است.
 */
function restoredBar(){
  const r = S.restored;
  if (!r) return;
  const by  = [r.provider, r.model].filter(Boolean).join('/');
  const day = dayFa(r.at), ago = agoFa(r.at);

  let head = day ? `این نتیجه‌ی ${esc(day)} است` : 'این نتیجه از قبل ذخیره شده بود';
  if (ago) head += ` — ${esc(ago)}`;
  if (by)  head += ` · با ${esc(by)} ساخته شده`;

  let h = `<div class="old">${head}
    <button class="g hbtn" style="margin-inline-start:8px" onclick="freshStart()">شروع از نو</button></div>`;

  if (r.mismatch) {
    const now = [r.mismatch.provider, r.mismatch.model].filter(Boolean).join('/');
    h += `<div class="gate">این را ${esc(by || 'سرویس دیگری')} ساخته، ولی الان ${esc(now)} فعال است.
      آنچه می‌بینی خروجی مدل قبلی است، نه مدل فعلی.
      <br><button class="g" style="margin-top:10px" onclick="freshStart()">با ${esc(now)} از نو بساز</button></div>`;
  }
  M.insertAdjacentHTML('afterbegin', h);
}

function paint(){
  if (!url && !S.needs) return start();
  if (S.state === 'low_confidence') return lowConf();
  if (S.needs === 'pageText')    return pageBlocked();
  if (S.needs === 'competitors') return competitors();
  if (S.needs === 'answers')     return questions();
  if (S.needs === 'approval')    return strategy();
  if (S.state === 'done')        return campaign();
  return start();
}

// همان منطق سرور، این‌جا فقط برای نشان‌دادن
function nrm(kind, raw){
  let v = String(raw||'').trim().replace(/^@+/,'').replace(/\s+/g,'')
          .replace(/^https?:\/\//i,'').replace(/^www\./i,'');
  if(!v) return null;
  if(kind==='instagram'){ v=v.replace(/^(?:m\.)?instagram\.com\//i,'').split(/[?#]/)[0].replace(/\/+$/,'');
    return v ? 'instagram.com/'+v : null; }
  if(kind==='telegram'){ v=v.replace(/^(?:t\.me|telegram\.me)\//i,'').split(/[?#]/)[0].replace(/\/+$/,'');
    return v ? 't.me/'+v : null; }
  v=v.replace(/\/+$/,'');
  return v.includes('.') ? v : null;
}
function prev(){
  const p = $('#pv'); if(!p) return;
  const rows = [['site','f_site','سایت'],['instagram','f_ig','اینستاگرام'],['telegram','f_tg','تلگرام']]
    .map(([k,id,fa]) => { const v = nrm(k, val(id)); return v ? `${fa}: <span dir="ltr">${esc(v)}</span>` : null; })
    .filter(Boolean);
  const site = val('f_site');
  const bad  = site && !nrm('site', site) ? '<div style="color:#c33">سایت باید نقطه داشته باشد — مثل example.com</div>' : '';
  p.innerHTML = bad + (rows.length ? 'می‌خوانم → ' + rows.join(' · ') : '');
}
function go(){
  if (busy) return;                    // فرم دیگر در DOM نیست
  // ⚠ همه‌ی ورودی‌ها را *قبل* از spin بخوان.
  // spin محتوای صفحه را عوض می‌کند و ورودی‌ها از DOM حذف می‌شوند؛
  // خواندن بعد از آن یعنی null.value و کل تابع بی‌صدا می‌میرد.
  const site = val('f_site'), ig = val('f_ig'), tg = val('f_tg'), note = val('n');
  if(!site && !ig && !tg){ alert('دست‌کم یکی را پر کن.'); return; }
  spin('منابع را می‌خوانم…', true);
  api('/api/run', { site, instagram:ig, telegram:tg, note });
}

// نوار «چه خواندم و چه نخواندم» — بالای هر صفحه‌ای که بعد از منابع می‌آید
function sourceBar(){
  const src = (S.page && S.page.sources) || [];
  if (!src.length) return '';
  const ok  = src.filter(x=>x.ok);
  const bad = src.filter(x=>!x.ok);
  // «از تاریخچه» پنهان نمی‌ماند: شاهدِ دیروز نباید شاهدِ امروز جا بزند
  const age = t => { if(!t) return ''; const h = (Date.now()-new Date(t).getTime())/3600000;
                     return h < 1 ? 'همین حالا' : (h < 48 ? Math.round(h)+' ساعت پیش'
                                                          : Math.round(h/24)+' روز پیش'); };
  const tag = x => esc(x.label) + (x.posts?` (${x.posts} پست)`:'')
                 + (x.via==='history' ? ` — از تاریخچه، ${age(x.readAt)}` : '');
  let h = `<div class="gate">خواندم: ${ok.map(tag).join(' · ') || '—'}`;
  if (bad.length) h += `<br>نخواندم: ${bad.map(x=>esc(x.label)+' ('+esc(x.error||'')+')').join(' · ')}`
                    + `<br><span class="sm">اینها را «ندارد» حساب نکردم — «نمی‌دانم» حساب کردم.</span>`;
  const ig = src.find(x => x.kind === 'instagram');
  if (bad.length) h += `<br><button class="g" style="margin-top:10px" onclick="retrySources()">دوباره بخوان</button>`;
  if (ig) h += `<br><button class="g" style="margin-top:10px" onclick="igScreen()">استخراج عمیق اینستاگرام</button>`;
  return h + '</div>';
}

async function igStart(){
  const target = val('ig_t');
  if(!target){ alert('آدرس یا آی‌دی پیج را بنویس.'); return; }
  const body = { target,
    posts: Number(val('ig_p')), reels: Number(val('ig_r')),
    withMedia: $('#ig_m').checked };
  $('#ig_out').innerHTML = '<p class="sm">در حال ثبت کار…</p>';
  try{
    const r = await fetch('/api/instagram/sync', {method:'POST',
      headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    igJob = j.jobId;
    igPoll();
  }catch(e){ $('#ig_out').innerHTML = errBox(e.message, 'دوباره امتحان کن', 'igStart()'); }
}

function igPoll(){
  clearInterval(igTimer);
  igTimer = setInterval(async () => {
    const box = $('#ig_out'); if(!box){ clearInterval(igTimer); return; }
    try{
      const j = await (await fetch('/api/instagram/job/' + igJob)).json();
      const p = j.progress || {};
      const bar = p.total ? `${p.done||0} از ${p.total}` : '';
      box.innerHTML = `<div class="card"><b>${esc(faStatus(j.status))}</b>
        <div class="sm">${esc(p.note||'')} ${bar}</div>
        ${j.error?`<div class="err" style="margin-top:8px">${esc(j.error)}</div>`:''}
        ${['failed','interrupted'].includes(j.status)
          ? '<button style="margin-top:10px" onclick="igStart()">دوباره امتحان کن</button>' : ''}
        ${j.status==='done'?igResult(j.result):''}</div>`;
      if (['done','failed','interrupted'].includes(j.status)) clearInterval(igTimer);
    }catch(e){ clearInterval(igTimer);
      // پرسیدن از کار قطع شد — خودِ کار ممکن است هنوز روی سرور زنده باشد
      box.innerHTML = errBox(e.message, 'دوباره بپرس', 'igPoll()'); }
  }, 2000);
}

const faStatus = s => ({queued:'در صف',running:'در حال اجرا',done:'تمام شد',
  failed:'شکست خورد',interrupted:'وسط کار قطع شد'}[s] || s);

function igResult(r){
  if(!r) return '';
  const items = r.newItems || [];
  const ok = items.filter(i=>i.extraction?.status==='ok').length;
  const part = items.filter(i=>i.extraction?.status==='partial').length;
  const bad = items.filter(i=>i.extraction?.status==='failed').length;
  const notes = (r.notes||[]).map(n=>`<div class="sm">⚠ ${esc(n)}</div>`).join('');
  return `<div style="margin-top:10px">
    <div class="sm">${items.length} محتوا · ${ok} کامل · ${part} ناقص · ${bad} ناموفق`
    + (r.skipped?` · ${r.skipped} تکراری رد شد`:'') + `</div>${notes}
    ${items.slice(0,6).map(i=>`<div class="pc"><div class="n">${esc(i.type||'')} ${i.publishedAt?'· '+esc(i.publishedAt.slice(0,10)):''}</div>
      <div class="a">${esc((i.caption||'(بدون کپشن)').slice(0,90))}</div>
      <div class="sm">گفتار: ${esc(faExt(i.speechStatus))} · روی تصویر: ${esc(faExt(i.imageTextStatus))}`
      + (i.metrics?.likes!=null?` · ${i.metrics.likes} لایک`:'') + `</div></div>`).join('')}
    ${items.length>6?`<p class="sm">و ${items.length-6} تای دیگر — در «محتواهای ذخیره‌شده» ببین</p>`:''}

}

    <input id="cw" placeholder="مثلاً: چهره‌ام را نشان ندهم">

function pick(el){
  const k = el.dataset.q!==undefined ? 'q' : 'a';
  document.querySelectorAll(`.chip[data-${k}="${el.dataset[k]}"]`).forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
}
function sendAns(){
  if (busy) return;
  const answers={}, assumptions={}, constraints=[];
  (S.questions.questions||[]).forEach((q,i)=>{
    const t=document.querySelector(`.qt[data-q="${i}"]`).value.trim();
    const c=document.querySelector(`.chip[data-q="${i}"].on`);
    answers['q'+(i+1)] = t || (c?c.textContent:'نمی‌دانم');
  });
  (S.questions.assumptions||[]).forEach((a,i)=>{
    const c=document.querySelector(`.chip[data-a="${i}"].on`);
    const t=document.querySelector(`.at[data-a="${i}"]`).value.trim();
    assumptions[a.statement] = c && c.textContent==='درست است' ? 'درست' : (t||'نه');
  });
  const w=val('cw');
  if(w) constraints.push({what:w,reason:val('cr')||'نگفته',kind:'concern_based',
    setAt:new Date().toISOString().slice(0,10),revisitWhen:['اگر کاربر خودش دوباره مطرح کند']});
  spin('برنامه را می‌سازم…', true);
  api('/api/run/answers',{url,answers,assumptions,constraints});
}

 * «با چه چیزی می‌فهمیم جواب داد؟»
 *
 * دو چیزی که کارت باید بگوید و بدون نمایششان همان حرف نگفته می‌ماند:
 *   · خط پایه نامعلوم است → قدم اول شمردن است، نه ساختن محتوا.
 *   · اقدام با ابزارهای ما دیده نمی‌شود → همان‌جا صریح گفته شود.
 * هر دو از خود کارت می‌آیند؛ مرورگر چیزی حدس نمی‌زند.
 */
function measureBox(m){
  if (!m) return '';
  let h = '';
  if (m.countFirst)
    h += `<div class="card" style="border-color:#ecdcae;background:var(--ambs)"><b>قبل از شروع</b>
      <div class="v">${esc(m.countFirst)}</div>
      <div class="sm" style="margin-top:6px">بدون این عدد، دو هفته بعد نمی‌شود گفت جواب داد یا نه.</div></div>`;
  if (m.countable === false)
    h += `<div class="gate">${esc(m.blindSpot || 'نتیجه‌ی این اقدام با ابزارهای ما دیده نمی‌شود — باید خودت بشماری.')}</div>`;
  return h;
}

function strategy(){
  const c = S.strategy;
  M.innerHTML = `<div class="day">سه راه — و نظر من</div>
  ${(c.options||[]).map((o,i)=>`<div class="card"><b>راه ${i+1}${o.kind==='step_back'?' · بدون محتوا':''}</b>
    <div class="v" style="font-weight:600">${esc(o.title)}</div>
    <div class="sm" style="margin-top:6px">${esc(o.summary)}</div></div>`).join('')}
  <div class="card" style="border-color:#c5e3cf;background:#f7fcf9"><b>توصیه‌ی من</b>
    <div class="v" style="font-weight:700">${esc(c.recommended?.title)}</div>
    <div class="sm" style="margin-top:7px">${esc(c.recommended?.why)}</div></div>
  <hr style="border:none;border-top:1px solid var(--line);margin:24px 0">
  <div class="day">برنامه ${c.mode==='small_test'?'· آزمایش کوچک':''}</div>
  ${Object.entries(c.cells||{}).map(([k,v])=>`<div class="card"><b>${FA[k]||k}
    <span class="tag ${v.origin==='fact'?'t-f':'t-h'}">${v.origin==='fact'?'واقعیت':'حدس'}</span></b>
    <div class="v">${esc(v.value)}</div></div>`).join('')}
  ${measureBox(c.measurement)}
  ${c.reachCaveat?`<div class="gate">${esc(c.reachCaveat)}</div>`:''}
  <div class="card"><b>پیش‌بینی من</b><div class="v">${esc(c.prediction?.observable)}</div>
    <div class="sm" style="margin-top:6px">${c.prediction?.checkAfterDays??14} روز بعد همین را می‌پرسم.</div></div>
  <div class="more" onclick="tog('rk')">خطرناک‌ترین فرض این برنامه چیست؟</div>
  <div class="fold" id="rk"><div class="card" style="border-color:#f0c7c3;background:#fefaf9">
    <div class="sm">${esc(c.riskiestAssumption)}</div></div></div>
  <div class="gate" style="margin-top:16px"><b>تا اینجا هیچ محتوایی ساخته نشده.</b>
    تا این برنامه را تأیید نکنی، یک خط هم نمی‌نویسم.</div>
  ${c.producedBy?`<p class="sm" style="opacity:.6">این کارت را ${esc(c.producedBy.provider)}/${esc(c.producedBy.model||'')} ساخته</p>`:''}
  <button onclick="approve()">تأیید می‌کنم</button>`;
}
function approve(){ spin('کمپین را طراحی می‌کنم…', true); api('/api/run/approve',{url}); }

function usageBar(){
  const u = S.usage; if(!u) return '';
  const eng = S.engine ? `${S.engine.provider}/${S.engine.model||''} · ` : '';
  return `<p class="sm" style="opacity:.6">${esc(eng)}${u.calls} فراخوانی · ${Math.round(u.seconds)} ثانیه · `
       + `${(u.inputTokens/1000).toFixed(0)}K→${(u.outputTokens/1000).toFixed(1)}K توکن`
       + (u.usd ? ` · $${u.usd.toFixed(2)} (${esc(u.model||'')})` : '')
       // هزینه‌ی مدل جایگزین را نمی‌دانیم؛ صفر نشانش نمی‌دهیم
       + (u.unpriced ? ` · هزینه‌ی ${u.unpriced} فراخوان نامعلوم (${esc(u.model||'')})` : '')
       + `</p>`;
}
function campaign(){
  const c = S.campaign || {};
  M.innerHTML = `<div class="day">کمپین</div>
  <h2>${(c.pieces||[]).length} قطعه</h2>
  ${(c.pieces||[]).map(p=>`<div class="pc"><div class="n">قطعه ${p.n} · ${PUR[p.purpose]||p.purpose}</div>
    <div class="a">${esc(p.angle)}</div>
    ${p.product?`<div class="sm">محصول: ${esc(p.product)}</div>`:''}
    ${p.timing?`<div class="sm">زمان: ${esc(String(p.timing).slice(0,120))}</div>`:''}</div>`).join('')}
  <div class="card"><b>ثابت می‌ماند</b><div class="sm">${(c.heldConstant||[]).map(h=>'· '+esc(String(h).split('—')[0])).join('<br>')}</div></div>
  <div class="card" style="border-color:#d6c8ff;background:var(--vs)"><b>فقط این تغییر می‌کند</b>
    <div class="v">${esc(c.varies?.what)}</div>
    <div class="sm" style="margin-top:6px">${esc(c.varies?.why)}</div></div>
  ${c.capacityCheck?`<p class="sm">ظرفیت: ${c.capacityCheck.statedTotal} قطعه اگر حرفت درست باشد → ${c.capacityCheck.realisticTotal} واقع‌بینانه</p>`:''}
  <hr style="border:none;border-top:1px solid var(--line);margin:26px 0">
  <div class="day">قبل از انتشار</div>
  <h2>متن را اینجا بگذار تا چک کنم</h2>
  <p class="sm">هر ادعایی که پشتش چیزی نباشد را می‌گیرم. آخرین ایست.</p>
  <textarea id="ct" placeholder="کپشنی که می‌خواهی منتشر کنی"></textarea>
  <button onclick="check()">بررسی کن</button>
  <div id="cr2"></div>
  <button class="g" onclick="reset()" style="margin-top:24px">کسب‌وکار جدید</button>
  ${usageBar()}`;
}
async function check(){
  const content = val('ct'); if(!content) return;
  // این تنها دکمه‌ای است که بعد از کلیک روی صفحه می‌ماند —
  // بدون این محافظ، هر کلیک یک درخواست تازه می‌سازد.
  if (busy) return;
  busy = true;
  $('#cr2').innerHTML = '<div class="sm" style="padding:14px 0">در حال بررسی…</div>';
  try{
    const r = await fetch('/api/check',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({url,content})});
    const j = await r.json();
    const bad = (j.claims||[]).filter(c=>c.status!=='ok'&&c.status!=='n/a');
    $('#cr2').innerHTML = (j.gate?.pass
      ? '<div class="good">✓ همه‌ی ادعاها پشتوانه دارند. قابل انتشار است.</div>'
      : `<div class="gate">${bad.length} مورد نیاز به اصلاح دارد.</div>`) +
      bad.map(c=>`<div class="cl"><span class="tag ${c.status==='blocked'?'t-w':'t-h'}">${
        c.status==='blocked'?'بسته':c.status==='needsRecheck'?'کهنه':'تأیید تو لازم'}</span> ${esc(c.text)}
        ${c.rewrite?`<div class="sm">پیشنهاد: ${esc(c.rewrite)}</div>`:''}</div>`).join('');
  }catch(e){ $('#cr2').innerHTML = errBox(e.message, 'دوباره بررسی کن', 'check()'); }
  finally{ busy = false; }
}

function tog(id){ $('#'+id).classList.toggle('on'); }
function reset(){ S={}; url=''; render(); }
render();
</script></body></html>
